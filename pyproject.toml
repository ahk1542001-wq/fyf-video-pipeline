[project]
name = "fyf-video-pipeline"
version = "0.1.0"
description = "Evidence-led Burmese video generation with Gemini, Google ADK, native telemetry, and deterministic Remotion rendering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "google-cloud-aiplatform[agent_engines,adk]>=1.112,<2",
    "google-genai>=2.17.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend", "voice_service"]


