[project]
name = "fyf-video-pipeline"
version = "0.1.0"
description = "Evidence-led Burmese video generation with Gemini, native telemetry, and deterministic Remotion rendering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.17.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "uvicorn>=0.52.1",
]

[project.optional-dependencies]
partner-voices = [
    "kaggle>=2.2,<3",
]
operator-tools = [
    "colab-mcp; python_version >= '3.13'",
    "mcp-server-colab-exec>=0.1.0; python_version >= '3.13'",
]

[tool.uv.sources]
colab-mcp = { git = "https://github.com/googlecolab/colab-mcp" }
